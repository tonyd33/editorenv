name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: editorenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check -L

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: editorenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv

      - name: flake
        working-directory: examples/flake
        run: nix eval .#devShells.x86_64-linux.default.drvPath

      - name: flake-parts
        working-directory: examples/flake-parts
        run: nix eval .#devShells.x86_64-linux.default.drvPath

      - name: devenv
        working-directory: examples/devenv
        run: |
          devenv shell true
          test -L .nvim.lua
          grep -F 'vim.lsp.enable("gopls")' .nvim.lua
          grep -F 'vim.lsp.enable("buf_ls")' .nvim.lua

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: editorenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - run: devenv test
